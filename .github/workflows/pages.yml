name: Deploy Erun to GitHub Pages

on:
  push:
    # The github-pages environment was created when this repo's only branch was
    # claude/app-ui-polish-demo-lkcbhs, so its deployment branch policy admits
    # that branch and rejects main before a runner is even assigned. Build on
    # both until the policy is relaxed (the configure job below tries to do so).
    branches: [main, claude/app-ui-polish-demo-lkcbhs]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # This job deliberately has no `environment:` block. A job bound to the
  # github-pages environment is rejected before it is ever assigned a runner if
  # Pages is off or its source is set to "Deploy from a branch" — the run then
  # fails in about a second with no logs at all, which is impossible to debug.
  # This job always runs, prints the live Pages configuration, and repairs it to
  # build_type=workflow so the deploy job below is allowed to proceed.
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Report and repair Pages configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          echo "::group::Pages configuration before"
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "$api")
          echo "GET /pages -> HTTP $code"
          cat /tmp/pages.json || true
          echo
          echo "::endgroup::"

          if [ "$code" = "404" ]; then
            echo "Pages is not enabled. Enabling it with source = GitHub Actions."
            curl -sS -o /tmp/out.json -w 'POST /pages -> HTTP %{http_code}\n' \
              -X POST "${auth[@]}" "$api" -d '{"build_type":"workflow"}'
            cat /tmp/out.json || true
            echo
          else
            build_type=$(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('build_type') or '')")
            echo "Current build_type: '${build_type}'"
            if [ "$build_type" != "workflow" ]; then
              echo "Source is not GitHub Actions. Switching it over."
              curl -sS -o /tmp/out.json -w 'PUT /pages -> HTTP %{http_code}\n' \
                -X PUT "${auth[@]}" "$api" -d '{"build_type":"workflow"}'
              cat /tmp/out.json || true
              echo
            else
              echo "Source is already GitHub Actions. Nothing to change."
            fi
          fi

          echo "::group::Pages configuration after"
          curl -sS "${auth[@]}" "$api"
          echo
          echo "::endgroup::"

          # The github-pages environment restricts which branches may deploy to
          # it. If it was created before main existed, main is not on that list
          # and its deploy job is rejected instantly, with no logs. Try to clear
          # the restriction. GITHUB_TOKEN often lacks the rights for this, so a
          # failure here is expected and must not fail the build - the workflow
          # also triggers on the already-permitted branch as a fallback.
          echo "::group::Deployment branch policy"
          curl -sS "${auth[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/github-pages" || true
          echo
          curl -sS -o /tmp/env.json -w 'PUT /environments/github-pages -> HTTP %{http_code}\n' \
            -X PUT "${auth[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/github-pages" \
            -d '{"deployment_branch_policy":null}' || true
          cat /tmp/env.json || true
          echo
          echo "::endgroup::"

  deploy:
    needs: configure
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
